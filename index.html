<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Edge</title>
<meta name="theme-color" content="#F3F2EF" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Edge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Polished with unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 */
:root{
  --paper:#F3F2EF; --surface:#FFFFFF; --raised:#ECEAE6;
  --ink:#15171A; --ink-2:#555A62; --ink-3:#6B7078;
  --hair:rgba(21,23,26,.08);
  --graphite:#1B1E22; --graphite-2:#25292E; --on-g:#F3F2EF; --on-g-2:#A9AEB6; --hair-g:rgba(243,242,239,.09);
  --signal:#EE5A2E;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Source Serif 4",Georgia,serif;
  --pad:20px; --ease:cubic-bezier(0.22,1,0.36,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--ink);text-decoration-color:var(--ink-3);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
.shell{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.view{padding-bottom:calc(96px + var(--safe-b));animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.mono{font-family:var(--mono);font-size:12px;line-height:16px;letter-spacing:0;font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none}

/* Masthead */
.mast{padding:calc(16px + var(--safe-t)) var(--pad) 0;display:flex;align-items:center;justify-content:space-between;min-height:calc(56px + var(--safe-t))}
.wordmark{font-weight:500;font-size:20px;line-height:1;letter-spacing:-.01em;margin:0}
.wordmark span{color:var(--signal)}
.mast .mono{color:var(--ink-2)}
.meta-row{padding:24px var(--pad) 0;display:flex;justify-content:space-between;align-items:baseline;color:var(--ink-2);font-size:15px}
.meta-row strong{color:var(--ink);font-weight:500}
.ticks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:12px var(--pad) 0}
.ticks i{height:4px;border-radius:2px;background:var(--raised);transition:background-color .3s var(--ease)}
.ticks i.on{background:var(--ink)}
.banner{margin:16px var(--pad) 0;padding:4px 4px 4px 16px;border-radius:12px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2)}
.banner button{color:var(--ink);font-weight:500;min-height:44px;padding:0 12px;border-radius:8px}

/* Lead: the one rich moment */
.lead{margin:16px 12px 0;background:var(--graphite);color:var(--on-g);border-radius:20px;padding:24px 20px 20px}
.lead .k{display:flex;justify-content:space-between;color:var(--on-g-2)}
.lead .k b{color:var(--on-g);font-weight:400}
.lead h2{font-size:28px;line-height:1.14;letter-spacing:-.01em;font-weight:500;margin:16px 0;text-wrap:balance}
.tl{margin:0;border-top:1px solid var(--hair-g)}
.tl div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair-g)}
.tl dt{color:var(--on-g-2);padding-top:2px}
.tl dd{margin:0;font-size:15px;line-height:22px}
.tl .use dt{color:var(--on-g)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:10px;font-weight:500;font-size:15px;width:100%;transition:transform .15s var(--ease),background-color .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--ink)}
@media (hover:hover){.btn-primary:hover{background:#F06A41}}
.lead .btn{margin-top:20px}
.done-card h2{margin-bottom:8px}
.done-card p{color:var(--on-g-2);margin:0;font-size:15px;line-height:22px}

/* List */
.label{padding:24px var(--pad) 8px;color:var(--ink-2)}
.list{margin:0 12px;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;min-height:72px;border-top:1px solid var(--hair);transition:background-color .15s var(--ease)}
.row:first-child{border-top:0}
.row:active{background:var(--paper)}
@media (hover:hover){.row:hover{background:#F8F7F5}}
.tile{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile.read{background:var(--ink);color:var(--paper)}
.tile .ico{width:16px;height:16px}
.row .s{color:var(--ink-2);margin-bottom:4px}
.row .t{font-size:16px;line-height:22px;font-weight:500}
.row.is-read .t{color:var(--ink-2)}
.row .m{color:var(--ink-3);align-self:start;padding-top:2px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--hair);padding-bottom:var(--safe-b)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-3);transition:color .15s var(--ease)}
.tabs button[aria-current="page"]{color:var(--ink)}

/* Article */
.a-head{background:var(--graphite);color:var(--on-g);padding:calc(8px + var(--safe-t)) 8px 32px}
.a-bar{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--on-g);transition:background-color .15s var(--ease)}
.icon-btn:active{background:var(--graphite-2)}
.a-bar .mono{color:var(--on-g-2);padding-right:12px}
.a-head .inner{padding:8px 12px 0}
.a-head .kick{color:var(--on-g-2)}
.a-head h1{font-size:32px;line-height:1.12;letter-spacing:-.01em;font-weight:500;margin:12px 0 16px;text-wrap:balance}
.a-head .sub{color:var(--on-g-2)}
.short{margin:0;background:var(--surface);padding:4px var(--pad)}
.short .tl{border-top:0}
.short .tl div{border-bottom:1px solid var(--hair)}
.short .tl div:last-child{border-bottom:0}
.short .tl dt{color:var(--ink-3)}
.short .tl .use dt{color:var(--ink)}
.prose{padding:32px var(--pad) 8px;font-family:var(--serif);font-size:18px;line-height:30px;max-width:36em}
.prose p{margin:0 0 20px}
.prose p.sub-h{font-family:var(--sans);font-size:16px;line-height:22px;font-weight:500;margin:32px 0 8px}
.sources{padding:8px var(--pad) 24px}
.sources h3{margin:0 0 8px;color:var(--ink-3);font-weight:400}
.sources ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;line-height:20px}
.sources li{margin-bottom:8px}
.watch{padding:8px 12px 0;display:grid;gap:8px}
.w-item{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:4px}
.w-item .when{color:var(--ink-3)}
.w-item h3{margin:0;font-size:16px;line-height:22px;font-weight:500}
.w-item p{margin:0;color:var(--ink-2);font-size:15px;line-height:22px}
.a-foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--hair);padding:12px 12px calc(12px + var(--safe-b))}
.a-foot .inner{max-width:576px;margin:0 auto}
.a-foot .btn{justify-content:space-between;padding:0 20px}
.a-foot .btn span:last-child{font-weight:400;font-size:14px}

/* Recap and archive */
.page-h{padding:calc(16px + var(--safe-t)) var(--pad) 0}
.page-h h1{font-size:28px;line-height:1.15;letter-spacing:-.01em;font-weight:500;margin:8px 0 0}
.page-h .mono{color:var(--ink-3)}
.empty{margin:24px 12px 0;background:var(--surface);border-radius:16px;padding:24px 20px 8px}
.empty .when{font-size:20px;line-height:28px;font-weight:500;margin:8px 0 16px}
.empty ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--hair)}
.empty li{padding:12px 0;border-bottom:1px solid var(--hair);font-size:15px;line-height:22px;display:grid;grid-template-columns:32px 1fr;color:var(--ink)}
.empty li span{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.empty li:last-child{border-bottom:0}
.rc{margin:12px 12px 0;background:var(--surface);border-radius:16px;padding:20px 20px 8px}
.rc h2{margin:0 0 12px;font-size:12px;line-height:16px;font-family:var(--mono);font-weight:400;color:var(--ink-3)}
.idea{padding:12px 0;border-top:1px solid var(--hair)}
.idea:first-of-type{border-top:0;padding-top:0}
.idea b{display:block;font-weight:500;font-size:16px;line-height:22px;margin-bottom:4px}
.idea span{color:var(--ink-2);font-size:15px;line-height:22px}
.q{padding:4px 0 16px}
.q p{margin:0 0 12px;font-weight:500;font-size:16px;line-height:22px}
.opt{display:block;width:100%;text-align:left;min-height:44px;padding:12px 16px;margin-bottom:8px;border-radius:10px;background:var(--paper);font-size:15px;line-height:20px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.opt.right{background:var(--ink);color:var(--paper)}
.opt.wrong{background:rgba(220,38,38,.08);color:#B42318}
.q .ex{font-size:14px;color:var(--ink-2);line-height:20px;margin:4px 0 0}
.story{font-family:var(--serif);font-size:17px;line-height:28px;margin:0 0 12px}
.reflect{font-family:var(--serif);font-size:20px;line-height:28px;margin:0 0 16px}
.state{padding:40vh var(--pad) 0;text-align:center;color:var(--ink-2)}

/* Sunday story */
.story-card .story-text{font-family:var(--serif);font-size:17px;line-height:28px;color:var(--on-g);margin:0}

/* Stack watch */
.stack-card{display:grid;gap:8px;width:calc(100% - 24px);margin:0 12px;text-align:left;background:var(--surface);border-radius:16px;padding:16px 16px 20px;border:1px solid var(--hair);transition:background-color .15s var(--ease),transform .15s var(--ease)}
.stack-card:active{transform:scale(.98)}
@media (hover:hover){.stack-card:hover{background:#F8F7F5}}
.sc-top{display:flex;justify-content:space-between;align-items:baseline}
.sc-co{font-size:15px;line-height:20px;font-weight:500}
.sc-top .mono{color:var(--ink-3)}
.sc-t{font-size:18px;line-height:24px;font-weight:500;color:var(--ink);text-wrap:balance}
.sc-layers{color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 8px}
.sc-layers i{font-style:normal;color:var(--hair);color:rgba(21,23,26,.2)}
.layers{background:var(--surface);margin:12px 0 0;padding:20px var(--pad) 8px}
.layers h2,.watch-h{margin:0 0 8px;font-weight:400;color:var(--ink-3)}
.watch-h{padding:16px 8px 0}
.layers dl{margin:0}
.layers dl div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.layers dt{color:var(--ink-3);padding-top:2px}
.layers dd{margin:0;display:grid;gap:4px}
.layers dd b{font-weight:500;font-size:15px;line-height:20px}
.layers dd span{color:var(--ink-2);font-size:14px;line-height:20px}
.state .btn{max-width:220px;margin:16px auto 0;background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="shell"><main id="app" aria-live="polite"><div class="state">Loading today's edition…</div></main></div>
<div class="tabs" id="tabs" hidden>
  <nav aria-label="Sections">
    <button type="button" data-tab="today"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Today</button>
    <button type="button" data-tab="recap"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Weekly recap</button>
    <button type="button" data-tab="archive"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="4" rx="1.2"/><path d="M5 9v9a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18V9"/><path d="M10 13h4"/></svg>Archive</button>
  </nav>
</div>
<script>
(function(){
  var app = document.getElementById('app');
  var tabs = document.getElementById('tabs');
  var S = { index:null, edition:null, viewing:null, recap:null, readSet:{} };
  var KEY = 'daily-edge:read';

  function loadRead(){ try{ var v = JSON.parse(localStorage.getItem(KEY) || '[]'); v.forEach(function(k){ S.readSet[k]=1; }); }catch(e){} }
  function saveRead(){ try{ localStorage.setItem(KEY, JSON.stringify(Object.keys(S.readSet))); }catch(e){} }
  function rk(n){ return S.viewing + '#' + n; }
  function isRead(n){ return !!S.readSet[rk(n)]; }
  function markRead(n){ S.readSet[rk(n)] = 1; saveRead(); }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function words(a){ return (a.body || []).reduce(function(t,p){ return t + p.split(/\s+/).length; }, 0); }
  function mins(a){ if (a.watch) return a.minutes || 2; return Math.max(2, Math.round(words(a) / 200)); }
  function shortDate(iso){
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
  function getJSON(path){
    return fetch(path, { cache:'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function isSub(p){ return p.length < 60 && !/[.?!”]$/.test(p.trim()); }

  var ICON_CHECK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_BACK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  function tldr(a){
    return '<dl class="tl">' +
      '<div><dt class="mono">What</dt><dd>' + esc(a.what) + '</dd></div>' +
      '<div><dt class="mono">Why</dt><dd>' + esc(a.why) + '</dd></div>' +
      '<div class="use"><dt class="mono">Use it</dt><dd>' + esc(a.use) + '</dd></div>' +
    '</dl>';
  }

  var themeMeta = document.getElementById('theme-color');
  function setTabs(active){
    tabs.hidden = !active;
    if (themeMeta) themeMeta.setAttribute('content', active ? '#F3F2EF' : '#1B1E22');
    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function(b){
      if (b.getAttribute('data-tab') === active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
  }

  function renderToday(){
    var e = S.edition, arts = e.articles;
    var readCount = arts.filter(function(a){ return isRead(a.n); }).length;
    var total = arts.reduce(function(t,a){ return t + mins(a); }, 0);
    var left = arts.filter(function(a){ return !isRead(a.n); }).reduce(function(t,a){ return t + mins(a); }, 0);
    var next = arts.filter(function(a){ return !isRead(a.n); })[0];
    var isLatest = S.viewing === S.index.latest;

    var h = '<div class="view">';
    h += '<header class="mast"><h1 class="wordmark">Daily <span>Edge</span></h1><span class="mono">' + esc(shortDate(e.date)) + '</span></header>';
    if (!isLatest) h += '<div class="banner"><span>Past edition</span><button type="button" data-act="latest">Back to latest</button></div>';
    h += '<div class="meta-row"><span>' + (readCount === arts.length ? '<strong>All read</strong>' : '<strong>' + readCount + ' of ' + arts.length + '</strong> read') + '</span><span class="mono">' + (left ? left + ' min left' : total + ' min') + '</span></div>';
    h += '<div class="ticks" aria-hidden="true">' + arts.map(function(a){ return '<i class="' + (isRead(a.n) ? 'on' : '') + '"></i>'; }).join('') + '</div>';

    var weekStory = S.recap && S.recap.date === S.viewing && S.recap.story ? S.recap : null;
    if (weekStory) {
      h += '<article class="lead story-card" aria-label="Story of the week">' +
        '<div class="k mono"><span>Story of the week</span><span>' + esc(weekStory.week || '') + '</span></div>' +
        '<h2>' + esc(weekStory.story.title) + '</h2><p class="story-text">' + esc(weekStory.story.text) + '</p>' +
        '<button type="button" class="btn btn-primary" data-tab="recap">Open the weekly recap</button>' +
      '</article>';
      next = null;
    } else if (next) {
      h += '<article class="lead" aria-label="Up next">' +
        '<div class="k mono"><span><b>' + pad(next.n) + '</b>&ensp;' + esc(next.section) + '</span><span>' + mins(next) + ' min</span></div>' +
        '<h2>' + esc(next.title) + '</h2>' + tldr(next) +
        '<button type="button" class="btn btn-primary" data-open="' + next.n + '">Read the story</button>' +
      '</article>';
    } else {
      h += '<article class="lead done-card"><div class="k mono"><span>Edition complete</span><span>' + total + ' min</span></div>' +
        '<h2>Today\'s edition, done</h2><p>Tomorrow\'s edition arrives at 8:00 AM. The week comes together in Sunday\'s recap.</p></article>';
    }

    var st = e.stack;
    if (st && st.company) {
      h += '<div class="label mono">Stack watch</div>' +
        '<button type="button" class="stack-card" data-act="stack">' +
          '<span class="sc-top"><span class="sc-co">' + esc(st.company) + '</span><span class="mono">' + stackMins(st) + ' min</span></span>' +
          '<span class="sc-t">' + esc(st.title) + '</span>' +
          '<span class="sc-layers mono">' + (st.layers || []).map(function(l){ return esc(l.name); }).join('<i aria-hidden="true">/</i>') + '</span>' +
        '</button>';
    }

    var rest = next ? arts.filter(function(a){ return a !== next; }) : arts;
    h += '<div class="label mono">' + (next ? 'Also today' : 'Today\'s ' + arts.length) + '</div><div class="list" role="list">';
    rest.forEach(function(a){
      var r = isRead(a.n);
      h += '<button type="button" role="listitem" class="row' + (r ? ' is-read' : '') + '" data-open="' + a.n + '">' +
        '<span class="tile' + (r ? ' read' : '') + '" aria-hidden="true">' + (r ? ICON_CHECK : pad(a.n)) + '</span>' +
        '<span><span class="s mono" style="display:block">' + esc(a.section) + '</span><span class="t">' + esc(a.title) + '</span>' + (r ? '<span class="sr" style="position:absolute;left:-9999px">, read</span>' : '') + '</span>' +
        '<span class="m mono">' + mins(a) + ' min</span></button>';
    });
    h += '</div></div>';
    app.innerHTML = h;
    setTabs('today');
  }

  function renderArticle(n){
    var arts = S.edition.articles;
    var a = arts.filter(function(x){ return x.n === n; })[0];
    if (!a) { go('today'); return; }
    var idx = arts.indexOf(a), nxt = arts[idx + 1];
    var srcs = (a.sources || []).filter(function(s){ return s.title; });

    var h = '<div class="view">';
    h += '<header class="a-head"><div class="a-bar"><button type="button" class="icon-btn" data-act="back" aria-label="Back to today">' + ICON_BACK + '</button><span class="mono">' + pad(a.n) + ' / ' + pad(arts.length) + '</span></div>' +
      '<div class="inner"><div class="kick mono">' + esc(a.section) + '</div><h1>' + esc(a.title) + '</h1>' +
      '<div class="sub mono">' + mins(a) + ' min read' + (srcs.length ? ' · ' + srcs.length + ' source' + (srcs.length > 1 ? 's' : '') : '') + '</div></div></header>';

    h += '<section class="short" aria-label="In short">' + tldr(a) + '</section>';

    if (a.watch && a.watch.length) {
      h += '<div class="watch">' + a.watch.map(function(w){
        return '<div class="w-item"><span class="when mono">' + esc(w.when) + '</span><h3>' + esc(w.title) + '</h3><p>' + esc(w.why) + '</p></div>';
      }).join('') + '</div>';
    }
    if (a.body && a.body.length) {
      h += '<div class="prose">' + a.body.map(function(p){ return isSub(p) ? '<p class="sub-h">' + esc(p) + '</p>' : '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    }
    if (srcs.length) {
      h += '<div class="sources"><h3 class="mono">Sources and further reading</h3><ol>' + srcs.map(function(s){
        var u = safeUrl(s.url);
        return '<li>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' : esc(s.title)) + '</li>';
      }).join('') + '</ol></div>';
    }
    h += '</div>';
    h += '<div class="a-foot"><div class="inner"><button type="button" class="btn btn-primary" data-act="done" data-n="' + a.n + '">' +
      '<span>' + (isRead(a.n) ? 'Read' : 'Mark as read') + '</span><span>' + (nxt ? 'Next: ' + esc(nxt.section) + ' →' : 'Back to today') + '</span></button></div></div>';
    app.innerHTML = h;
    setTabs(null);
  }

  function stackMins(st){
    var w = (st.body || []).reduce(function(t,p){ return t + p.split(/\s+/).length; }, 0);
    return Math.max(2, Math.round(w / 200) + 1);
  }
  function sourcesHtml(list){
    var srcs = (list || []).filter(function(s){ return s.title; });
    if (!srcs.length) return '';
    return '<div class="sources"><h3 class="mono">Sources and further reading</h3><ol>' + srcs.map(function(s){
      var u = safeUrl(s.url);
      return '<li>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' : esc(s.title)) + '</li>';
    }).join('') + '</ol></div>';
  }

  function renderStack(){
    var st = S.edition.stack;
    if (!st || !st.company) { go('today'); return; }
    var n = (st.sources || []).filter(function(s){ return s.title; }).length;
    var h = '<div class="view">';
    h += '<header class="a-head"><div class="a-bar"><button type="button" class="icon-btn" data-act="back" aria-label="Back to today">' + ICON_BACK + '</button><span class="mono">Stack watch</span></div>' +
      '<div class="inner"><div class="kick mono">' + esc(st.company) + '</div><h1>' + esc(st.title) + '</h1>' +
      '<div class="sub mono">' + stackMins(st) + ' min read' + (n ? ' · ' + n + ' source' + (n > 1 ? 's' : '') : '') + '</div></div></header>';
    h += '<section class="short" aria-label="In short">' + tldr(st) + '</section>';
    if (st.layers && st.layers.length) {
      h += '<section class="layers" aria-label="The stack"><h2 class="mono">The stack, layer by layer</h2><dl>' + st.layers.map(function(l){
        return '<div><dt class="mono">' + esc(l.layer) + '</dt><dd><b>' + esc(l.name) + '</b><span>' + esc(l.note) + '</span></dd></div>';
      }).join('') + '</dl></section>';
    }
    if (st.body && st.body.length) h += '<div class="prose">' + st.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    if (st.watch && st.watch.length) {
      h += '<div class="watch"><h2 class="mono watch-h">What to watch</h2>' + st.watch.map(function(w){
        return '<div class="w-item"><span class="when mono">' + esc(w.when) + '</span><h3>' + esc(w.title) + '</h3>' + (w.why ? '<p>' + esc(w.why) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    }
    h += sourcesHtml(st.sources) + '</div>';
    h += '<div class="a-foot"><div class="inner"><button type="button" class="btn btn-primary" data-act="back"><span>Back to today</span><span>' + esc(st.next ? 'Tomorrow: ' + st.next : '') + '</span></button></div></div>';
    app.innerHTML = h;
    setTabs(null);
  }

  function nextSunday(){
    var d = new Date(); var add = (7 - d.getDay()) % 7; if (add === 0 && d.getHours() >= 8) add = 7;
    d.setDate(d.getDate() + add);
    return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  }

  function renderRecap(){
    var h = '<div class="view"><header class="page-h"><span class="mono">Sundays, 8:00 AM</span><h1>Weekly recap</h1></header>';
    var r = S.recap;
    if (!r) {
      h += '<section class="empty"><span class="mono" style="color:var(--ink-2)">First recap</span><div class="when">' + esc(nextSunday()) + '</div><ul>' +
        '<li><span>01</span>The week\'s five ideas worth keeping</li>' +
        '<li><span>02</span>A five-question quiz to make them stick</li>' +
        '<li><span>03</span>What moved on your watch list</li>' +
        '<li><span>04</span>One story worth retelling this week</li>' +
        '<li><span>05</span>A reflection: which idea did you use?</li></ul></section>';
    } else {
      h += '<div class="meta-row" style="padding-top:8px"><span>' + esc(r.week || '') + '</span></div>';
      if (r.ideas) h += '<section class="rc"><h2>Five ideas</h2>' + r.ideas.map(function(i){ return '<div class="idea"><b>' + esc(i.title) + '</b><span>' + esc(i.line) + '</span></div>'; }).join('') + '</section>';
      if (r.quiz) h += '<section class="rc"><h2>Quiz</h2>' + r.quiz.map(function(q, qi){
        return '<div class="q" data-q="' + qi + '"><p>' + (qi + 1) + '. ' + esc(q.q) + '</p>' + q.options.map(function(o, oi){
          return '<button type="button" class="opt" data-q="' + qi + '" data-o="' + oi + '">' + esc(o) + '</button>';
        }).join('') + '<p class="ex" hidden>' + esc(q.explain || '') + '</p></div>';
      }).join('') + '</section>';
      if (r.watch) h += '<section class="rc"><h2>Watch list</h2>' + r.watch.map(function(w){ return '<div class="idea"><b>' + esc(w.title) + '</b><span>' + esc(w.status) + '</span></div>'; }).join('') + '</section>';
      if (r.story) h += '<section class="rc"><h2>Story to retell</h2><div class="idea" style="border:0;padding-top:0"><b>' + esc(r.story.title) + '</b></div><p class="story">' + esc(r.story.text) + '</p></section>';
      if (r.reflect) h += '<section class="rc"><h2>Reflect</h2><p class="reflect">' + esc(r.reflect) + '</p></section>';
    }
    h += '</div>';
    app.innerHTML = h;
    setTabs('recap');
  }

  function renderArchive(){
    var eds = (S.index.editions || []).slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var h = '<div class="view"><header class="page-h"><span class="mono">' + eds.length + ' edition' + (eds.length === 1 ? '' : 's') + '</span><h1>Archive</h1></header>';
    h += '<div class="list" style="margin-top:20px" role="list">' + eds.map(function(e){
      var d = new Date(e.date + 'T00:00:00');
      return '<button type="button" role="listitem" class="row" data-edition="' + esc(e.date) + '">' +
        '<span class="tile" aria-hidden="true">' + d.getDate() + '</span>' +
        '<span><span class="s mono" style="display:block">' + esc(shortDate(e.date)) + '</span><span class="t">' + esc(e.lead) + '</span></span>' +
        '<span class="m mono">' + (e.date === S.viewing ? 'Open' : '') + '</span></button>';
    }).join('') + '</div></div>';
    app.innerHTML = h;
    setTabs('archive');
  }

  function failure(msg){
    app.innerHTML = '<div class="state"><div>' + esc(msg) + '</div><button type="button" class="btn" data-act="retry">Try again</button></div>';
    tabs.hidden = true;
  }

  function route(){
    var h = (location.hash || '').slice(1) || 'today';
    window.scrollTo(0, 0);
    if (!S.edition) return;
    var m = /^read-(\d+)$/.exec(h);
    if (m) return renderArticle(parseInt(m[1], 10));
    if (h === 'stack') return renderStack();
    if (h === 'recap') return renderRecap();
    if (h === 'archive') return renderArchive();
    renderToday();
  }
  function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }

  function openEdition(date){
    return getJSON('editions/' + date + '.json').then(function(e){ S.edition = e; S.viewing = date; });
  }

  function boot(){
    app.innerHTML = '<div class="state">Loading today\'s edition…</div>';
    getJSON('editions/index.json').then(function(idx){
      S.index = idx;
      var recapP = (idx.recaps && idx.recaps.length) ? getJSON('recaps/' + idx.recaps[idx.recaps.length - 1].date + '.json').then(function(r){ S.recap = r; }).catch(function(){}) : Promise.resolve();
      return Promise.all([openEdition(idx.latest), recapP]);
    }).then(route).catch(function(){ failure('Today\'s edition could not be loaded.'); });
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-tab')) return go(t.getAttribute('data-tab'));
    if (t.hasAttribute('data-open')) return go('read-' + t.getAttribute('data-open'));
    if (t.hasAttribute('data-edition')) { var d = t.getAttribute('data-edition'); return openEdition(d).then(function(){ go('today'); }).catch(function(){ failure('That edition could not be loaded.'); }); }
    if (t.classList.contains('opt')) {
      var qi = +t.getAttribute('data-q'), oi = +t.getAttribute('data-o'), q = S.recap.quiz[qi];
      var box = t.parentNode;
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b, i){ b.disabled = true; if (i === q.answer) b.classList.add('right'); else if (i === oi) b.classList.add('wrong'); });
      var ex = box.querySelector('.ex'); if (ex) ex.hidden = false;
      return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'back') return go('today');
    if (act === 'stack') return go('stack');
    if (act === 'retry') return boot();
    if (act === 'latest') return openEdition(S.index.latest).then(function(){ go('today'); });
    if (act === 'done') {
      var n = +t.getAttribute('data-n'); markRead(n);
      var arts = S.edition.articles, i = arts.map(function(a){ return a.n; }).indexOf(n);
      return go(arts[i + 1] ? 'read-' + arts[i + 1].n : 'today');
    }
  });
  window.addEventListener('hashchange', route);
  loadRead();
  boot();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {}
  }
})();
</script>
</body>
</html>
