<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Edge</title>
<meta name="theme-color" content="#F3F2EF" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Edge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<script>
/* Theme is set before first paint. Modes: auto (follows the phone), light, dark. */
(function(){try{var m=localStorage.getItem('de-theme')||'auto';var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();
</script>
<style>
/* Daily Edge v4. News scan, learning blocks and one question. One screen per item. */
:root{
  --bg:#F3F2EF; --surface:#FFFFFF; --raised:#E9E7E2; --track:#DEDBD5;
  --ink:#15171A; --ink2:#50555D; --hair:rgba(21,23,26,.10);
  --accent:#EE5A2E; --accent-ink:#B8401A;
  --hero:#1B1E22; --on-hero:#F3F2EF; --on-hero2:#B9BEC5; --hero-accent:#FF9A73;
  --up:#157347; --down:#B93A32;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
[data-theme="dark"]{
  --bg:#121417; --surface:#1C1F23; --raised:#282C31; --track:#30353B;
  --ink:#F3F2EF; --ink2:#A9AEB6; --hair:rgba(243,242,239,.12);
  --accent:#EE5A2E; --accent-ink:#FF9A73;
  --hero:#F3F2EF; --on-hero:#15171A; --on-hero2:#50555D; --hero-accent:#B8401A;
  --up:#4CC38A; --down:#FF8A80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent-ink)}
#app{max-width:480px;margin:0 auto}
.view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:16px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));animation:in .32s var(--ease)}
.view.from-right{animation-name:inr}.view.from-left{animation-name:inl}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--ink2)}
.small{font-size:12px;line-height:1.4}
.grow{flex:1}

/* Home */
.home h1{margin:4px 0 4px;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.home .sub{font-size:15px;color:var(--ink2)}
.headrow{display:flex;align-items:flex-start;gap:12px}
.seg{display:flex;background:var(--raised);border-radius:12px;padding:3px;flex:none}
.seg button{min-height:38px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg svg{width:15px;height:15px}
.prog{display:flex;gap:4px}
.prog i{height:6px;border-radius:3px;background:var(--track);transition:background .3s}
.prog i.on{background:var(--accent)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{width:100%;min-height:64px;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);display:flex;align-items:center;gap:12px;transition:transform .15s var(--ease)}
.row:active{transform:scale(.985)}
.row .num{width:28px;height:28px;border-radius:14px;background:var(--raised);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:16px;font-weight:600}
.row .t span{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .min{font-size:13px;font-weight:600;color:var(--ink2);flex:none}
.row.next{background:var(--hero);color:var(--on-hero);border-color:transparent;min-height:76px}
.row.next .num{background:var(--accent);color:#15171A}
.row.next .t span{color:var(--on-hero2)}
.row.next .min{color:var(--hero-accent)}
.row.done .num{background:transparent;border:1.5px solid var(--accent);color:var(--accent-ink)}
.row.done .t b{color:var(--ink2)}
.row .num svg{width:15px;height:15px}
.links{display:flex;gap:10px;justify-content:center;padding-top:4px}
.link{min-height:44px;padding:0 14px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;align-items:center}

/* Reader */
.bar{display:flex;align-items:center;gap:8px;margin:-6px -8px 0}
.bar .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.bar .ib svg{width:22px;height:22px}
.bar .bt{flex:1;font-size:14px;font-weight:600}
.bar .cnt{font-size:13px;color:var(--ink2);padding-right:8px}
.pager{display:flex;gap:4px}
.pager i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.pager i.on{background:var(--accent)}
.card h1{margin:6px 0 0;font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.vis{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:14px}
.stat{display:flex;align-items:center;gap:14px}
.stat b{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--accent-ink);flex:none}
.stat span{font-size:13px;line-height:1.35;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .bt2{font-size:12px;color:var(--ink2)}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.brow .bl{font-size:13px}
.brow .bv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.brow .btrack{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--raised);overflow:hidden}
.brow .bfill{height:100%;border-radius:5px;background:var(--ink2);width:0;transition:width .7s var(--ease)}
.brow.hot .bfill{background:var(--accent)}
.brow.hot .bl{font-weight:700}
.steps{display:flex;align-items:center;gap:6px}
.steps .s{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:var(--raised);font-size:12px;font-weight:600;color:var(--ink2)}
.steps .s.hot{background:var(--hero);color:var(--hero-accent);font-weight:700}
.steps svg{width:14px;height:14px;flex:none;color:var(--ink2)}
.flow{display:flex;flex-direction:column;gap:6px;padding:10px}
.flow .f{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--raised)}
.flow .fn{width:22px;height:22px;border-radius:11px;background:var(--surface);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.flow .ft{display:flex;flex-direction:column;gap:1px;min-width:0}
.flow .ft b{font-size:14px;font-weight:700}
.flow .ft span{font-size:12.5px;line-height:1.3;color:var(--ink2)}
.flow .f.hot{background:var(--hero);color:var(--on-hero)}
.flow .f.hot .fn{background:var(--accent);color:#15171A}
.flow .f.hot .ft span{color:var(--on-hero2)}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:10px 2px 0}
.grp:first-child{padding-top:0}
.tl{display:flex;flex-direction:column;gap:4px}
.tl p{margin:0;font-size:16px;line-height:1.42}
.say{background:var(--hero);color:var(--on-hero);border-radius:14px;padding:12px 14px}
.say .kick{color:var(--hero-accent)}
.say p{font-weight:600}
.deep{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--hair);padding-top:14px}
.deep p{margin:0;font-size:15px;line-height:1.55}
.src{display:flex;flex-direction:column;gap:6px;font-size:13px}
.src a{text-decoration:none;display:block;padding:4px 0}
.foot{display:flex;gap:10px;position:sticky;bottom:0;padding:10px 0 calc(4px + env(safe-area-inset-bottom));margin-bottom:-12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{flex:1;min-height:50px;border-radius:14px;font-size:15px;font-weight:600;text-align:center;border:1.5px solid var(--ink);padding:0 10px}
.btn.pri{background:var(--hero);color:var(--on-hero);border-color:var(--hero)}
.btn:active{transform:scale(.98)}

/* Markets */
.why1{background:var(--hero);color:var(--on-hero);border-radius:16px;padding:14px}
.why1 .kick{color:var(--hero-accent)}
.why1 p{margin:4px 0 0;font-size:16px;line-height:1.4;font-weight:600}
.mk{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:4px 14px}
.mrow{display:flex;align-items:center;gap:10px;min-height:42px}
.mrow.div{border-top:1px solid var(--hair)}
.mrow .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .mn b{font-size:15px;font-weight:600}
.mrow .mn span{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mbar{width:84px;height:8px;border-radius:4px;background:var(--raised);position:relative;flex:none}
.mbar:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink2);opacity:.5}
.mbar i{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .7s var(--ease)}
.mbar i.up{left:50%;background:var(--up)}
.mbar i.dn{right:50%;background:var(--down)}
.mch{width:74px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mch.up{color:var(--up)}.mch.dn{color:var(--down)}.mch.na{color:var(--ink2);font-weight:500}

/* Question */
.q{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:22px 20px}
.q .kick{color:var(--hero-accent)}
.q p{margin:10px 0 0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.ctx{font-size:15px;line-height:1.5;color:var(--ink2);margin:0}

.arow{width:100%;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);display:flex;flex-direction:column;gap:2px;justify-content:center}
.arow b{font-size:14px}.arow span{font-size:13px;color:var(--ink2)}
.state{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink2)}
</style>
</head>
<body>
<div id="app"><div class="state">Loading today's digest</div></div>
<script>
(function(){
  'use strict';
  var app = document.getElementById('app');
  var S = { index:null, ed:null, date:null, dir:'', deep:false };
  var THEME = 'de-theme', DONE = 'de-done';

  /* storage */
  function load(k, d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function doneSet(){ return (load(DONE, {})[S.date]) || []; }
  function isDone(id){ return doneSet().indexOf(id) > -1; }
  function markDone(id){
    var all = load(DONE, {}), list = all[S.date] || [];
    if (list.indexOf(id) < 0) list.push(id);
    all[S.date] = list;
    var keys = Object.keys(all).sort(); while (keys.length > 21) delete all[keys.shift()];
    save(DONE, all);
  }

  /* theme */
  function themeMode(){ try{ return localStorage.getItem(THEME) || 'auto'; }catch(e){ return 'auto'; } }
  function applyTheme(){
    var m = themeMode(), dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var tc = document.getElementById('theme-color'); if (tc) tc.setAttribute('content', dark ? '#121417' : '#F3F2EF');
  }
  function setTheme(m){ try{ localStorage.setItem(THEME, m); }catch(e){} applyTheme(); }
  if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(applyTheme); }
  applyTheme();

  /* helpers */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }
  function getJSON(p){ return fetch(p, { cache:'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function svg(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var I = {
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>'),
    moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>')
  };
  function pct(v){ return (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '') + Math.abs(v).toFixed(2) + '%'; }
  function shortDate(iso){ var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' }); }

  /* Older editions (8 articles, markets) are mapped onto blocks so they still open. */
  function normalize(e){
    if (e.blocks) return e;
    var blocks = [], m = e.markets;
    (e.articles || []).forEach(function(a){
      blocks.push({ id:'a' + a.n, title:a.section, sub:a.title, minutes:2, cards:[{
        tag:a.section, title:a.title,
        visual: a.figure && a.figure.value ? { type:'stat', value:a.figure.value, label:a.figure.label } : null,
        what:a.what, why:a.why, say:a.use, sayLabel:'Use it', deeper:a.body || [], sources:a.sources || []
      }]});
    });
    if (m && m.indexes) blocks.push({ id:'markets', title:'Markets in 60 seconds', sub:m.title || '', minutes:1,
      markets:{ asof:m.asof, why:m.summary, indexes:m.indexes, extras:m.extras || [], sources:m.sources || [] } });
    return { date:e.date, label:e.label, blocks:blocks, legacy:true };
  }
  function blocks(){ return S.ed.blocks; }
  function totalMin(){ return blocks().reduce(function(t,b){ return t + (b.minutes || 1); }, 0); }

  function mount(html){ app.innerHTML = html; var v = app.firstChild; if (v && S.dir) v.classList.add(S.dir); S.dir = ''; window.scrollTo(0, 0); }

  /* Home */
  function renderHome(){
    var bs = blocks(), done = bs.filter(function(b){ return isDone(b.id); }).length;
    var left = bs.reduce(function(t,b){ return t + (isDone(b.id) ? 0 : (b.minutes || 1)); }, 0);
    var firstOpen = -1; bs.some(function(b,i){ if (!isDone(b.id)) { firstOpen = i; return true; } return false; });
    var builder = bs.some(function(b){ return b.id === 'builder'; });
    var mode = themeMode(), latest = S.index && S.date === S.index.latest;
    var h = '<div class="view home">';
    h += '<div class="headrow"><div class="grow"><div class="kick">' + esc(shortDate(S.date)) + '</div><h1>Daily Edge</h1>';
    h += '<div class="sub">' + bs.length + ' blocks. ' + totalMin() + ' minutes.' + (builder ? ' Builder edition today.' : '') + (S.ed.legacy ? ' Earlier format.' : '') + '</div></div>';
    h += '<div class="seg" role="group" aria-label="Appearance">';
    h += '<button type="button" data-theme-set="auto" aria-pressed="' + (mode === 'auto') + '">Auto</button>';
    h += '<button type="button" data-theme-set="light" aria-pressed="' + (mode === 'light') + '" aria-label="Light mode">' + I.sun + '</button>';
    h += '<button type="button" data-theme-set="dark" aria-pressed="' + (mode === 'dark') + '" aria-label="Dark mode">' + I.moon + '</button>';
    h += '</div></div>';
    h += '<div><div class="prog" role="img" aria-label="' + done + ' of ' + bs.length + ' blocks read">' + bs.map(function(b){ return '<i style="flex:' + (b.minutes || 1) + '"' + (isDone(b.id) ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
    h += '<div class="small muted" style="margin-top:8px">' + (done === bs.length ? 'All read. Done for today.' : done + ' of ' + bs.length + ' read. About ' + left + ' min left.') + '</div></div>';
    var lastGroup = '';
    h += '<div class="rows grow">' + bs.map(function(b, i){
      var d = isDone(b.id), cls = 'row' + (d ? ' done' : '') + (i === firstOpen ? ' next' : '');
      var g = b.group && b.group !== lastGroup ? '<div class="grp">' + esc(b.group) + '</div>' : ''; lastGroup = b.group || lastGroup;
      return g + '<button type="button" class="' + cls + '" data-go="b-' + i + '-0"><span class="num">' + (d ? I.check : (i + 1)) + '</span><span class="t"><b>' + esc(b.title) + '</b><span>' + esc(b.sub || '') + '</span></span><span class="min">' + (b.minutes || 1) + ' min</span></button>';
    }).join('') + '</div>';
    h += '<div class="links">' + (latest ? '' : '<button type="button" class="link" data-act="latest">Back to today</button>') + '<button type="button" class="link" data-go="archive">Earlier editions</button></div>';
    mount(h + '</div>');
  }

  /* Visuals */
  function visual(v){
    if (!v) return '';
    if (v.type === 'stat') return '<div class="vis stat"><b>' + esc(v.value) + '</b><span>' + esc(v.label || '') + '</span></div>';
    if (v.type === 'bars') {
      var max = Math.max.apply(null, v.items.map(function(x){ return Math.abs(x.value) || 0; })) || 1;
      return '<div class="vis bars">' + (v.title ? '<div class="bt2">' + esc(v.title) + '</div>' : '') + v.items.map(function(x){
        return '<div class="brow' + (x.hot ? ' hot' : '') + '"><span class="bl">' + esc(x.label) + '</span><span class="bv">' + esc(x.display || (x.value + (v.unit || ''))) + '</span><span class="btrack"><span class="bfill" data-w="' + Math.max(3, Math.round(Math.abs(x.value) / max * 100)) + '" style="display:block"></span></span></div>';
      }).join('') + '</div>';
    }
    if (v.type === 'steps') return '<div class="vis steps" role="img" aria-label="' + esc(v.items.map(function(x){ return x.label; }).join(', then ')) + '">' + v.items.map(function(x, i){ return (i ? I.arrow : '') + '<span class="s' + (x.hot ? ' hot' : '') + '">' + esc(x.label) + '</span>'; }).join('') + '</div>';
    if (v.type === 'flow') return '<div class="vis flow">' + v.items.map(function(x, i){ return '<div class="f' + (x.hot ? ' hot' : '') + '"><span class="fn">' + (i + 1) + '</span><span class="ft"><b>' + esc(x.label) + '</b><span>' + esc(x.note || '') + '</span></span></div>'; }).join('') + '</div>';
    return '';
  }
  function grow(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
    Array.prototype.forEach.call(app.querySelectorAll('[data-w]'), function(el){ el.style.width = el.getAttribute('data-w') + '%'; });
  }); }); }
  function sources(list){
    var ok = (list || []).filter(function(s){ return s && s.title; }); if (!ok.length) return '';
    return '<div class="src"><div class="kick">Sources</div>' + ok.map(function(s){ var u = safeUrl(s.url); return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' : '<span>' + esc(s.title) + '</span>'; }).join('') + '</div>';
  }
  function topbar(b, right){ return '<div class="bar"><button type="button" class="ib" data-go="home" aria-label="Back to today">' + I.back + '</button><div class="bt">' + esc(b.title) + '</div><div class="cnt">' + esc(right || '') + '</div></div>'; }
  function nextLabel(bi){ return bi < blocks().length - 1 ? 'Next block' : 'Finish'; }

  /* One card per screen */
  function renderCard(bi, ci){
    var b = blocks()[bi], cards = b.cards, c = cards[ci], n = cards.length, last = ci === n - 1;
    var hasDeep = (c.deeper && c.deeper.length) || (c.sources && c.sources.length);
    var h = '<div class="view card" data-b="' + bi + '" data-c="' + ci + '">';
    h += topbar(b, n > 1 ? (ci + 1) + ' of ' + n : (b.minutes || 1) + ' min');
    if (n > 1) h += '<div class="pager" aria-hidden="true">' + cards.map(function(x, i){ return '<i' + (i <= ci ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
    h += '<div>' + (c.tag ? '<div class="kick">' + esc(c.tag) + '</div>' : '') + '<h1>' + esc(c.title) + '</h1></div>';
    h += visual(c.visual);
    if (c.what) h += '<div class="tl"><div class="kick">' + esc(c.whatLabel || 'What') + '</div><p>' + esc(c.what) + '</p></div>';
    if (c.why) h += '<div class="tl"><div class="kick">' + esc(c.whyLabel || 'Why it matters') + '</div><p>' + esc(c.why) + '</p></div>';
    if (c.say) h += '<div class="tl say"><div class="kick">' + esc(c.sayLabel || 'Say it in the room') + '</div><p>' + esc(c.say) + '</p></div>';
    if (S.deep && hasDeep) h += '<div class="deep">' + (c.deeper || []).map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + sources(c.sources) + '</div>';
    h += '<div class="grow"></div><div class="foot">';
    if (hasDeep) h += '<button type="button" class="btn" data-act="deep" aria-expanded="' + (S.deep ? 'true' : 'false') + '">' + (S.deep ? 'Show less' : 'Go deeper') + '</button>';
    h += '<button type="button" class="btn pri" data-act="next">' + (last ? nextLabel(bi) : 'Next story') + '</button></div></div>';
    mount(h); grow();
  }

  function renderMarkets(bi){
    var b = blocks()[bi], m = b.markets;
    var nums = m.indexes.concat(m.extras || []).map(function(x){ return typeof x.change === 'number' ? Math.abs(x.change) : 0; });
    var max = Math.max.apply(null, nums.concat([0.5]));
    function row(name, sub, ch, div){
      var has = typeof ch === 'number', w = has ? Math.max(2, Math.round(Math.abs(ch) / max * 50)) : 0;
      return '<div class="mrow' + (div ? ' div' : '') + '"><span class="mn"><b>' + esc(name) + '</b><span>' + esc(sub || '') + '</span></span><span class="mbar" aria-hidden="true">' + (has && ch !== 0 ? '<i class="' + (ch > 0 ? 'up' : 'dn') + '" data-w="' + w + '" style="width:0"></i>' : '') + '</span><span class="mch ' + (has ? (ch > 0 ? 'up' : ch < 0 ? 'dn' : 'na') : 'na') + '">' + (has ? pct(ch) : 'n/a') + '</span></div>';
    }
    var prev = '', h = '<div class="view" data-b="' + bi + '">' + topbar(b, m.asof ? m.asof.replace(/^Closes of /, '').replace(/^[A-Za-z]+, /, '') : '');
    h += '<div class="why1"><div class="kick">The one-line why</div><p>' + esc(m.why || '') + '</p></div><div class="mk">';
    m.indexes.forEach(function(x){ var d = prev && x.region !== prev; prev = x.region; h += row(x.name, x.note ? x.note : x.close, x.change, d); });
    (m.extras || []).forEach(function(x, i){ h += row(x.name, [x.value, x.note].filter(Boolean).join(' · '), x.change, i === 0); });
    h += '</div>';
    if (S.deep) h += '<div class="deep">' + sources(m.sources) + '</div>';
    h += '<div class="grow"></div><div class="foot"><button type="button" class="btn" data-act="deep">' + (S.deep ? 'Hide sources' : 'Sources') + '</button><button type="button" class="btn pri" data-act="next">' + nextLabel(bi) + '</button></div></div>';
    mount(h); grow();
  }

  function renderQuestion(bi){
    var b = blocks()[bi], q = b.question;
    var h = '<div class="view" data-b="' + bi + '">' + topbar(b, (b.minutes || 1) + ' min');
    h += '<div class="q"><div class="kick">Ask this today</div><p>' + esc(q.text) + '</p></div>';
    if (q.context) h += '<p class="ctx">' + esc(q.context) + '</p>';
    h += '<div class="grow"></div><div class="foot"><button type="button" class="btn pri" data-act="next">' + nextLabel(bi) + '</button></div></div>';
    mount(h);
  }

  function renderArchive(){
    var h = '<div class="view"><div class="bar"><button type="button" class="ib" data-go="home" aria-label="Back to today">' + I.back + '</button><div class="bt">Earlier editions</div></div><div class="rows">';
    h += (S.index.editions || []).map(function(e){ return '<button type="button" class="arow" data-edition="' + esc(e.date) + '"><b>' + esc(e.label) + '</b><span>' + esc(e.lead || '') + '</span></button>'; }).join('');
    mount(h + '</div></div>');
  }

  function failure(msg){ app.innerHTML = '<div class="state"><div>' + esc(msg) + '</div><button type="button" class="btn" style="flex:none;padding:0 24px" data-act="retry">Try again</button></div>'; }

  /* Routing */
  function route(){
    if (!S.ed) return;
    var hsh = location.hash.slice(1), m = /^b-(\d+)-(\d+)$/.exec(hsh);
    if (m) {
      var bi = +m[1], ci = +m[2], b = blocks()[bi];
      if (!b) return renderHome();
      if (b.markets) return renderMarkets(bi);
      if (b.question) return renderQuestion(bi);
      if (b.cards && b.cards[ci]) return renderCard(bi, ci);
      return renderHome();
    }
    if (hsh === 'archive') return renderArchive();
    renderHome();
  }
  function go(hsh, dir){ S.dir = dir || ''; S.deep = false; if (location.hash.slice(1) === hsh) route(); else location.hash = hsh; }
  window.addEventListener('hashchange', route);

  function next(){
    var v = app.querySelector('.view[data-b]'); if (!v) return;
    var bi = +v.getAttribute('data-b'), ci = +(v.getAttribute('data-c') || 0), b = blocks()[bi];
    if (b.cards && ci < b.cards.length - 1) return go('b-' + bi + '-' + (ci + 1), 'from-right');
    markDone(b.id);
    if (bi < blocks().length - 1) return go('b-' + (bi + 1) + '-0', 'from-right');
    go('home');
  }
  function prev(){
    var v = app.querySelector('.view[data-b]'); if (!v) return;
    var bi = +v.getAttribute('data-b'), ci = +(v.getAttribute('data-c') || 0);
    if (ci > 0) return go('b-' + bi + '-' + (ci - 1), 'from-left');
    if (bi > 0) { var pb = blocks()[bi - 1]; return go('b-' + (bi - 1) + '-' + (pb.cards ? pb.cards.length - 1 : 0), 'from-left'); }
    go('home', 'from-left');
  }

  function openEdition(date){ return getJSON('editions/' + date + '.json').then(function(e){ S.ed = normalize(e); S.date = date; }); }
  function boot(){
    app.innerHTML = '<div class="state">Loading today\'s digest</div>';
    getJSON('editions/index.json').then(function(idx){ S.index = idx; return openEdition(idx.latest); })
      .then(route).catch(function(){ failure('Today\'s digest could not be loaded.'); });
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-theme-set')) { setTheme(t.getAttribute('data-theme-set')); return renderHome(); }
    if (t.hasAttribute('data-go')) return go(t.getAttribute('data-go'), /^b-/.test(t.getAttribute('data-go')) ? 'from-right' : '');
    if (t.hasAttribute('data-edition')) return openEdition(t.getAttribute('data-edition')).then(function(){ go('home'); }).catch(function(){ failure('That edition could not be loaded.'); });
    var act = t.getAttribute('data-act');
    if (act === 'next') return next();
    if (act === 'deep') { S.deep = !S.deep; var y = window.scrollY; route(); if (S.deep) { var d = app.querySelector('.deep'); if (d) d.scrollIntoView({ behavior:'smooth', block:'start' }); } else window.scrollTo(0, y); return; }
    if (act === 'latest') return openEdition(S.index.latest).then(function(){ go('home'); });
    if (act === 'retry') return boot();
  });

  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function(e){ var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive:true });
  document.addEventListener('touchend', function(e){
    if (!app.querySelector('.view[data-b]')) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
    if (dx < 0) next(); else prev();
  }, { passive:true });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});
  boot();
})();
</script>
</body>
</html>
